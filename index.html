<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lugha – Learn Kenyan languages from locals</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f0;--card:#fff;--ink:#14201b;--mute:#5d6b64;--teal:#0b4f4a;--on:#fff;--red:#c8102e;--sun:#ffc233;--line:#dbe3dc;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1714;--card:#14231f;--ink:#eef3ee;--mute:#9bb0a6;--teal:#5fd3c4;--on:#06201c;--line:#24382f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.1;margin:0}
a{color:inherit}button{font:inherit;cursor:pointer}
.shuka{height:14px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#8a0b20 14px 16px,var(--red) 16px 30px,#fff 30px 32px),var(--red);background-blend-mode:normal;border-bottom:3px solid var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font:800 24px 'Bricolage Grotesque',sans-serif;text-decoration:none;color:var(--teal);margin-right:auto}
.logo i{color:var(--red);font-style:normal}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--teal);color:var(--on);font-weight:700;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:#fff}.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:0 16px 60px}
.hero{padding:28px 0 10px}
.hero h1{font-size:clamp(34px,8vw,64px);max-width:14ch}
.hero p{color:var(--mute);max-width:52ch;font-size:18px}
.greet{display:flex;align-items:baseline;gap:12px;margin:18px 0;flex-wrap:wrap}
.greet b{font:800 clamp(30px,7vw,52px) 'Bricolage Grotesque',sans-serif;color:var(--red)}
.greet span{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tc{display:flex;flex-direction:column;gap:10px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 20px 'Bricolage Grotesque';color:#fff;flex:none}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
.tag{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.mute{color:var(--mute);font-size:14px}.price{font:800 20px 'Bricolage Grotesque'}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat.main{background:var(--teal);color:var(--on);border:0}
.stat b{display:block;font:800 28px 'Bricolage Grotesque'}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.st{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line)}
.st.completed,.st.paid-out{background:#c9f1d8;color:#0a4a24}.st.confirmed{background:#cfe6ff;color:#123e73}.st.paid,.st.processing{background:#ffe9b0;color:#6b4700}.st.cancelled{background:#ffd5d5;color:#7a1010}
.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:99;display:none;max-width:90vw}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .chip{flex:1;text-align:center}
.ck{display:flex;flex-wrap:wrap;gap:6px}.ck label{display:flex;gap:6px;align-items:center;font-weight:500;margin:0;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}.ck input{width:auto}
.tot{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.tot div{display:flex;justify-content:space-between}
.wrap{overflow-x:auto}
.feed{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 16px;scrollbar-width:none}
.pc{flex:none;width:285px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;transition:transform .2s,box-shadow .2s}
.pc:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}
.sms{background:var(--bg);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:13px;line-height:1.45;margin-top:10px;word-break:break-word}
.sms b{color:var(--teal)}
.bars{display:flex;gap:8px;height:130px;align-items:flex-end;margin-top:12px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:12px;color:var(--mute)}
.bc i{display:block;background:var(--teal);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.gb{display:flex;gap:10px;align-items:center;justify-content:center}
.doc h3{margin:22px 0 6px}.doc p,.doc li{max-width:70ch}.doc ul{padding-left:20px}
footer{max-width:1100px;margin:auto;padding:24px 16px;color:var(--mute);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<div class="shuka"></div>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* FIREBASE: paste your own web app config here (Firebase console > Project settings). While apiKey says YOUR_API_KEY the site runs in demo mode. */
const FB_CONFIG={apiKey:'AIzaSyAoCHh4MpXvF51TexK5U7PB7wUtzHP3GFE',authDomain:'lugha-c50d6.firebaseapp.com',projectId:'lugha-c50d6',appId:'1:496321113635:web:ec02384bffa7aeb37e0b96'};
let fbAuth=null;try{if(window.firebase&&FB_CONFIG.apiKey!=='YOUR_API_KEY'){firebase.initializeApp(FB_CONFIG);fbAuth=firebase.auth()}}catch(e){}
const KEY='lugha_v2',FEE=.15;
const mpesa=(n,a,ph,ts)=>{const d=new Date(ts),c=Array.from({length:10},(_,i)=>i?'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]:'Q').join('');return{code:c,msg:`${c} Confirmed. Ksh${a.toLocaleString()}.00 sent to ${n.toUpperCase()} ${ph.slice(0,4)}***${ph.slice(-3)} on ${d.toLocaleDateString('en-GB')} at ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}. Paid by Lugha for your lessons.`}};
const sp=(u,n,a,ph,h)=>({id:'seed'+h,u,amt:a,ph,st:'paid-out',ts:Date.now()-h*36e5,demo:1,...mpesa(n,a,ph,Date.now()-h*36e5)});
const L={Swahili:['Habari','How are you?'],Kikuyu:['Wî mwega?','How are you?'],Luo:['Oyawore','Good morning'],Kalenjin:['Chamge','Hello'],Luhya:['Mulembe','Peace, hello'],Kamba:['Wĩ mwaũ?','How are you?'],Kisii:['Bwakire','Good morning'],Maasai:['Supai','Hello'],Meru:['Mwega','Good'],Somali:['Iska warran','How are you?']};
const COL=['#0b4f4a','#c8102e','#7a4b00','#3b3b98','#1b7f4f','#8a1c5c'];
const seed=()=>({me:null,bk:[],po:[sp('t1','Amina Wanjiru',4500,'0712345678',5),sp('t2','Otieno Odhiambo',3200,'0722334455',22),sp('t4','Naserian Ole Sankale',6000,'0733445566',30),sp('t3','Kiprono Chebet',2400,'0711223344',52)],users:[
 {id:'t1',role:'tutor',name:'Amina Wanjiru',email:'amina@demo.ke',pw:'demo',langs:['Swahili','Kikuyu'],rate:900,city:'Nairobi',bio:'Former primary school teacher. I teach Swahili through everyday scenes: matatu rides, market haggling and family dinners.',rating:4.9,rn:42,bal:0,earned:0},
 {id:'t2',role:'tutor',name:'Otieno Odhiambo',email:'otieno@demo.ke',pw:'demo',langs:['Luo','Swahili'],rate:700,city:'Kisumu',bio:'Born on the shores of Lake Victoria. Learn Dholuo greetings, proverbs and fishing-village talk.',rating:4.8,rn:27,bal:0,earned:0},
 {id:'t3',role:'tutor',name:'Kiprono Chebet',email:'kiprono@demo.ke',pw:'demo',langs:['Kalenjin'],rate:800,city:'Eldoret',bio:'Runner and language nerd from the Rift Valley. Lessons mix conversation with running-camp vocabulary.',rating:5,rn:12,bal:0,earned:0},
 {id:'t4',role:'tutor',name:'Naserian Ole Sankale',email:'naserian@demo.ke',pw:'demo',langs:['Maasai','Swahili'],rate:1200,city:'Narok',bio:'Learn Maa from a Maasai guide. Greetings, livestock words and the etiquette that goes with them.',rating:4.9,rn:19,bal:0,earned:0},
 {id:'t5',role:'tutor',name:'Wafula Simiyu',email:'wafula@demo.ke',pw:'demo',langs:['Luhya','Swahili'],rate:600,city:'Kakamega',bio:'Patient teacher for complete beginners. We start with the sounds and build up to full conversations.',rating:4.7,rn:15,bal:0,earned:0},
 {id:'t6',role:'tutor',name:'Mutua Kioko',email:'mutua@demo.ke',pw:'demo',langs:['Kamba','Kikuyu'],rate:650,city:'Machakos',bio:'Software engineer by day, Kikamba teacher by evening. Great for remote workers moving to Kenya.',rating:4.6,rn:9,bal:0,earned:0},
 {id:'l1',role:'learner',name:'Sam Carter',email:'learner@demo.ke',pw:'demo',country:'UK'}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const me=()=>S.users.find(u=>u.id===S.me);
const U=id=>S.users.find(u=>u.id===id);
const kes=n=>'KES '+Math.round(n).toLocaleString();
const uid=()=>Math.random().toString(36).slice(2,9);
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const col=id=>COL[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const av=u=>`<div class="av" style="background:${col(u.id)}">${E(ini(u.name))}</div>`;
const fdate=t=>new Date(t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)};
const F={lang:'',q:''};let G='Swahili',authTab='login';

/* settle payouts: processing becomes paid-out after a few seconds (demo of M-Pesa B2C) */
function settle(){let p=0;S.po.forEach(x=>{if(x.st==='processing'){if(Date.now()-x.ts>4000){x.st='paid-out';Object.assign(x,mpesa(U(x.u).name,x.amt,x.ph,Date.now()))}else p=1}});save();if(p)setTimeout(app,1200)}

function nav(u){return `<header><a class="logo" href="#/">Lugha<i>.</i></a>
${u?`<a class="btn alt sm" href="#/dash">Dashboard</a><button class="btn alt sm" data-a="out">Log out</button>`:`<a class="btn alt sm" href="#/auth" data-a="tab" data-t="login">Log in</a><a class="btn sm" href="#/auth" data-a="tab" data-t="signup">Become a tutor</a>`}</header>`}

function home(){const tutors=S.users.filter(u=>u.role==='tutor');
return `<section class="hero"><h1>Learn Kenyan languages from the people who speak them</h1>
<p>Book one-to-one lessons with local tutors. Pay securely, learn live, and your tutor earns 85% of every session.</p>
<div class="greet"><b id="gw">${E(L[G][0])}</b><span id="gm">${E(G)} for “${E(L[G][1])}”</span></div></section>
<div class="stats"><div class="stat"><b>${tutors.length}</b>local tutors</div><div class="stat"><b>${Object.keys(L).length}</b>languages</div><div class="stat"><b>85%</b>goes to the tutor</div></div>
${payFeed()}<input id="q" placeholder="Search tutors by name or town" aria-label="Search tutors" value="${E(F.q)}">
<div class="chips" id="chips">${['',...Object.keys(L)].map(l=>`<button class="chip" aria-pressed="${F.lang===l}" data-a="lang" data-l="${l}">${l||'All languages'}</button>`).join('')}</div>
<div class="grid" id="grid"></div>`}

function drawGrid(){const g=$('#grid');if(!g)return;
const r=S.users.filter(u=>u.role==='tutor'&&(!F.lang||u.langs.includes(F.lang))&&(!F.q||(u.name+u.city).toLowerCase().includes(F.q.toLowerCase())));
g.innerHTML=r.length?r.map(u=>`<article class="card tc"><div class="row">${av(u)}<div><h3>${E(u.name)}</h3><span class="mute">${E(u.city)}, ★ ${u.rating.toFixed(1)} (${u.rn})</span></div></div>
<div class="row" style="flex-wrap:wrap;gap:6px">${u.langs.map(l=>`<span class="tag">${l}</span>`).join('')}</div>
<p class="mute" style="margin:0">${E(u.bio.slice(0,110))}${u.bio.length>110?'…':''}</p>
<div class="row sp"><span class="price">${kes(u.rate)}<small class="mute"> /hour</small></span><button class="btn sm" data-a="view" data-id="${u.id}">View profile</button></div></article>`).join(''):`<div class="card">No tutors match that search. Try another language or clear the search box.</div>`}

function auth(){const t=authTab;return `<div class="card" style="max-width:460px;margin:24px auto">
<div class="tabs"><button class="chip" aria-pressed="${t==='login'}" data-a="tab" data-t="login">Log in</button><button class="chip" aria-pressed="${t==='signup'}" data-a="tab" data-t="signup">Create account</button></div>
${t==='login'?`<form data-f="login"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="pw" type="password" required>
<button class="btn" style="width:100%;margin-top:16px">Log in</button></form>
<button class="btn alt gb" style="width:100%;margin-top:10px" data-a="google"><b style="color:#4285f4">G</b>Continue with Google</button>
<p class="mute">Try the demo accounts (password: demo):</p><div class="row" style="flex-wrap:wrap"><button class="btn alt sm" data-a="demo" data-e="amina@demo.ke">Tutor: Amina</button><button class="btn alt sm" data-a="demo" data-e="learner@demo.ke">Learner: Sam</button></div>`
:`<form data-f="signup"><label>I want to</label><select name="role" data-a="role"><option value="learner">Learn a language</option><option value="tutor">Teach a language</option></select>
<label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password (6+ characters)</label><input name="pw" type="password" minlength="6" required>
${rf2()}
<label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" required style="width:auto"><span>I agree to the <a href="#/privacy" target="_blank" rel="noopener">Privacy Policy</a></span></label>
<button class="btn" style="width:100%;margin-top:16px">Create account</button></form>
<button class="btn alt gb" style="width:100%;margin-top:10px" data-a="google"><b style="color:#4285f4">G</b>Sign up with Google</button>`}</div>`}

function bkRow(b,u){const t=U(b.t),l=U(b.l),isT=u.role==='tutor',o=isT?l:t;
return `<div class="item"><div class="row sp"><b>${E(o?.name)} <span class="mute">(${b.lang}, ${b.h}h)</span></b><span class="st ${b.st}">${b.st}</span></div>
<div class="mute">${fdate(b.at)}, ${isT?'you earn '+kes(b.net)+(o?.country?', learner from '+E(o.country):''):'paid '+kes(b.amt)}</div>
<div class="row" style="margin-top:8px;flex-wrap:wrap">
${b.st==='confirmed'?`<a class="btn red sm" target="_blank" rel="noopener" href="https://meet.jit.si/Lugha-${b.id}">Join lesson</a>`:''}
${isT&&b.st==='paid'?`<button class="btn sm" data-a="confirm" data-id="${b.id}">Accept</button>`:''}
${isT&&b.st==='confirmed'?`<button class="btn sm" data-a="done" data-id="${b.id}">Mark lesson complete</button>`:''}
${['paid','confirmed'].includes(b.st)?`<button class="btn alt sm" data-a="cancel" data-id="${b.id}">Cancel and refund</button>`:''}
${!isT&&b.st==='completed'&&!b.rev?`<select data-a="rate" data-id="${b.id}" style="width:auto"><option value="">Rate lesson</option>${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select>`:''}
${b.rev?`<span class="mute">Rated ★ ${b.rev}</span>`:''}</div></div>`}

function dash(u){const mine=S.bk.filter(b=>b[u.role==='tutor'?'t':'l']===u.id).sort((a,b)=>b.ts-a.ts);
if(u.role==='learner'){const sp=mine.filter(b=>b.st!=='cancelled').reduce((s,b)=>s+b.amt,0);
return `<h2 style="margin:20px 0 4px">Hi ${E(u.name.split(' ')[0])}</h2><div class="stats"><div class="stat main"><b>${mine.filter(b=>['paid','confirmed'].includes(b.st)).length}</b>upcoming lessons</div><div class="stat"><b>${mine.filter(b=>b.st==='completed').length}</b>completed</div><div class="stat"><b>${kes(sp)}</b>spent</div><div class="stat"><b>${mine.filter(b=>b.st==='completed').reduce((s,b)=>s+b.h,0)}h</b>hours learned</div><div class="stat"><b>${new Set(mine.map(b=>b.t)).size}</b>tutors met</div></div>
<div class="card"><h3>Your lessons</h3>${mine.map(b=>bkRow(b,u)).join('')||'<p class="mute">No lessons yet. <a href="#/">Find a tutor</a> and book your first one.</p>'}</div>`}
const pend=mine.filter(b=>['paid','confirmed'].includes(b.st)).reduce((s,b)=>s+b.net,0),pos=S.po.filter(p=>p.u===u.id).sort((a,b)=>b.ts-a.ts);
return `<h2 style="margin:20px 0 4px">Tutor dashboard</h2>
<div class="stats"><div class="stat main"><b>${kes(u.bal)}</b>available to withdraw</div><div class="stat"><b>${kes(pend)}</b>held until lessons finish</div><div class="stat"><b>${kes(u.earned)}</b>total earned</div><div class="stat"><b>${mine.filter(b=>b.st==='completed').length}</b>lessons taught</div></div>${tmetrics(u,mine)}
<div class="two"><div class="card"><h3>Withdraw to M-Pesa</h3><form data-f="payout"><label>Amount (KES, minimum 100)</label><input name="amt" type="number" min="100" max="${u.bal}" required><label>M-Pesa number</label><input name="ph" placeholder="0712345678" required>
<button class="btn" style="margin-top:14px" ${u.bal<100?'disabled':''}>Request payout</button></form>
<h3 style="margin-top:22px">Payouts and M-Pesa messages</h3><div class="wrap">${pos.map(p=>`<div class="item"><div class="row sp"><span><b>${kes(p.amt)}</b><br><span class="mute">${fdate(p.ts)}, ${E(p.ph)}</span></span><span class="st ${p.st}">${p.st==='paid-out'?'sent':'processing'}</span></div>${p.msg?`<div class="sms"><b>MPESA</b> ${E(p.msg)}</div>`:''}</div>`).join('')||'<p class="mute">No payouts yet.</p>'}</div></div>
<div class="card"><h3>Your profile</h3><form data-f="profile"><label>Languages you teach</label><div class="ck">${Object.keys(L).map(l=>`<label><input type="checkbox" name="langs" value="${l}" ${u.langs.includes(l)?'checked':''}>${l}</label>`).join('')}</div>
<label>Hourly rate (KES)</label><input name="rate" type="number" min="200" value="${u.rate}"><label>Town or city</label><input name="city" value="${E(u.city)}"><label>About you</label><textarea name="bio" rows="4">${E(u.bio)}</textarea>
<button class="btn" style="margin-top:14px">Save profile</button></form></div></div>
<div class="card" style="margin-top:14px"><h3>Bookings</h3>${mine.map(b=>bkRow(b,u)).join('')||'<p class="mute">No bookings yet. Complete your profile so learners can find you.</p>'}</div>`}

const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<60?m+' min ago':m<1440?(m/60|0)+' h ago':(m/1440|0)+' days ago'};
const rf2=()=>`<div class="lf"><label>Your country</label><input name="country"></div><div class="tf" style="display:none"><label>Languages you teach</label><div class="ck">${Object.keys(L).map(l=>`<label><input type="checkbox" name="langs" value="${l}">${l}</label>`).join('')}</div><label>Hourly rate (KES)</label><input name="rate" type="number" min="200" value="800"><label>Town or city</label><input name="city"></div>`;
function payFeed(){const p=S.po.filter(x=>x.st==='paid-out').sort((a,b)=>b.ts-a.ts).slice(0,8);if(!p.length)return'';
return `<h2 style="margin:20px 0 0;font-size:26px">Tutors getting paid</h2><div class="mute">Recent payouts sent by M-Pesa${p.some(x=>x.demo)?' (sample data until real payouts happen)':''}</div><div class="feed">${p.map(x=>{const t=U(x.u),n=t.name.split(' ');return `<div class="pc"><div class="row">${av(t)}<div><b>${E(n[0])} ${E(n[n.length-1][0])}.</b><br><span class="mute">${kes(x.amt)}, ${ago(x.ts)}</span></div></div><div class="sms"><b>MPESA</b> ${E(x.code)} Confirmed. Ksh${x.amt.toLocaleString()}.00 sent to ${E(n[0].toUpperCase())} for teaching on Lugha.${x.demo?' <span class="tag">Sample</span>':''}</div></div>`}).join('')}</div>`}
function tmetrics(u,mine){const c=mine.filter(b=>b.st==='completed'),by={};mine.filter(b=>b.st!=='cancelled').forEach(b=>(by[b.l]=by[b.l]||[]).push(b));
const ls=Object.entries(by),rep=ls.filter(([,a])=>a.length>1).length,W=6048e5;
const wk=[...Array(6)].map((_,i)=>{const e=Date.now()-(5-i)*W;return{l:new Date(e).toLocaleDateString([], {day:'numeric',month:'short'}),v:c.filter(b=>(b.cd||b.ts)>e-W&&(b.cd||b.ts)<=e).reduce((t,b)=>t+b.net,0)}}),mx=Math.max(...wk.map(w=>w.v),1);
return `<div class="stats"><div class="stat"><b>★ ${u.rating.toFixed(1)}</b>rating from ${u.rn} reviews</div><div class="stat"><b>${c.reduce((s,b)=>s+b.h,0)}h</b>hours taught</div><div class="stat"><b>${c.length?kes(u.earned/c.length):'None yet'}</b>average per lesson</div><div class="stat"><b>${ls.length?Math.round(rep/ls.length*100):0}%</b>learners who rebooked</div><div class="stat"><b>${mine.length?Math.round(c.length/mine.length*100):0}%</b>lessons completed</div></div>
<div class="two"><div class="card"><h3>Earnings by week</h3><div class="bars">${wk.map(w=>`<div class="bc" title="${kes(w.v)}"><i style="height:${w.v/mx*100}%"></i>${w.l}</div>`).join('')}</div></div>
<div class="card"><h3>Learners you teach</h3>${ls.map(([id,a])=>{const l=U(id),nx=a.filter(b=>['paid','confirmed'].includes(b.st)).sort((x,y)=>x.at-y.at)[0];
return `<div class="item row sp"><div class="row">${av(l)}<div><b>${E(l.name)}</b><br><span class="mute">${E(l.country||'Abroad')}, ${a.length} lessons${nx?', next '+fdate(nx.at):''}</span></div></div>${nx&&nx.st==='confirmed'?`<a class="btn red sm" target="_blank" rel="noopener" href="https://meet.jit.si/Lugha-${nx.id}">Join</a>`:''}</div>`}).join('')||'<p class="mute">Learners who book you will appear here with their country and next lesson.</p>'}</div></div>`}
function make(o){const u={id:uid(),role:o.role,name:o.name,email:o.email,pw:o.pw||''};
if(o.role==='tutor')Object.assign(u,{langs:o.langs,rate:+o.rate||800,city:o.city||'Kenya',bio:'New tutor on Lugha. Edit your profile to tell learners about your teaching style.',rating:5,rn:0,bal:0,earned:0});else u.country=o.country||'';
S.users.push(u);S.me=u.id;save();closeM();location.hash='#/dash';app();toast('Welcome to Lugha')}
function askRole(o){sheet(`<h2>Welcome, ${E(o.name.split(' ')[0])}</h2><p class="mute">Tell us how you will use Lugha.</p><form data-f="role" data-e="${E(o.email)}" data-n="${E(o.name)}"><label>I want to</label><select name="role" data-a="role"><option value="learner">Learn a language</option><option value="tutor">Teach a language</option></select>${rf2()}<label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" required style="width:auto"><span>I agree to the <a href="#/privacy" target="_blank" rel="noopener">Privacy Policy</a></span></label><button class="btn" style="width:100%;margin-top:14px">Continue</button></form>`)}
async function googleIn(){let g;if(fbAuth){try{g=(await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())).user}catch(e){return toast('Google sign-in was cancelled')}}else g={email:'google.demo@gmail.com',displayName:'Google Demo'};
const em=g.email.toLowerCase(),u=S.users.find(x=>x.email===em);if(u){S.me=u.id;save();location.hash='#/dash';return app()}askRole({email:em,name:g.displayName||em})}
function privacy(){return `<article class="doc card" style="margin:20px 0"><h2>Privacy Policy</h2><p class="mute">Last updated 28 October 2026</p>
<p>Lugha connects learners abroad with Kenyan tutors for paid language lessons. Lugha is operated by VECTUZ in Nairobi, Kenya. This policy explains what personal data we handle and why. Questions: ${E(CONTACT)}.</p>
<h3>What we collect</h3><ul><li>Account details: name and email. If you sign in with Google, we receive your Google name and email.</li><li>Learners: your country.</li><li>Tutors: town or city, languages, hourly rate, bio, and the M-Pesa number you give us for payouts.</li><li>Lesson records: bookings, times, amounts, and ratings.</li><li>Payment details: the M-Pesa number used to pay. We never see your M-Pesa PIN.</li></ul>
<h3>Why we use it</h3><ul><li>To create your account and let you log in.</li><li>To book lessons, take payment, and pay tutors.</li><li>To show tutor profiles and ratings, and to keep the platform safe.</li></ul>
<h3>Who sees your data</h3><ul><li>Tutors see the name and country of learners who book them. Learners see tutor profiles.</li><li>The public payout feed shows only a tutor’s first name, last initial, and amount.</li><li>Google Firebase handles sign-in. Safaricom M-Pesa handles payments and payouts. Jitsi Meet hosts video lessons under its own privacy policy.</li><li>We do not sell your data.</li></ul>
<h3>How long we keep it</h3><p>We keep account data while your account is open. Payment records are kept as long as the law requires for tax and accounting. When you ask us to delete your account, we remove your profile and anonymise lesson records we must keep.</p>
<h3>Your rights</h3><p>Under the Kenya Data Protection Act, 2019, you can ask to see, correct, or delete your data, and object to how we use it. Write to ${E(CONTACT)}. You can also complain to the Office of the Data Protection Commissioner of Kenya.</p>
<h3>Security and children</h3><p>We use Firebase Authentication to protect logins and ask you not to share your password. Lugha is for people aged 18 and over.</p>
<h3>Changes</h3><p>If we change this policy, we will update the date above and tell you in the app.</p></article>`}
function app(){settle();const u=me(),h=location.hash.slice(1)||'/';
$('#app').innerHTML=nav(u)+'<main>'+(h==='/privacy'?privacy():h==='/dash'&&u?dash(u):h==='/auth'||h==='/dash'?auth():home())+'</main><footer><span>© Lugha</span><a href="#/privacy">Privacy Policy</a></footer>';drawGrid()}

function sheet(html){const m=$('#modal');m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.add('on')}
const closeM=()=>$('#modal').classList.remove('on');

function view(id){const t=U(id);sheet(`<div class="row">${av(t)}<div><h2>${E(t.name)}</h2><span class="mute">${E(t.city)}, ★ ${t.rating.toFixed(1)} from ${t.rn} reviews</span></div></div>
<p>${E(t.bio)}</p><div class="row" style="flex-wrap:wrap;gap:6px">${t.langs.map(l=>`<span class="tag">${l}</span>`).join('')}</div>
<form data-f="book" data-id="${t.id}"><label>Language</label><select name="lang">${t.langs.map(l=>`<option>${l}</option>`).join('')}</select>
<label>Date and time</label><input name="at" type="datetime-local" required><label>Length</label><select name="h" data-a="calc"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option></select>
<label>M-Pesa number to pay from</label><input name="ph" placeholder="0712345678" required>
<div class="tot" id="tot" data-rate="${t.rate}"></div>
<div class="row" style="margin-top:14px"><button class="btn red" style="flex:1">Pay and book</button><button type="button" class="btn alt" data-a="close">Close</button></div></form>`);calc()}
function calc(){const t=$('#tot');if(!t)return;const h=+document.querySelector('[name=h]').value,a=t.dataset.rate*h;
t.innerHTML=`<div><span>Lesson (${h}h)</span><b>${kes(a)}</b></div><div class="mute"><span>Tutor receives</span><span>${kes(a*(1-FEE))}</span></div><div class="mute"><span>Lugha fee (15%)</span><span>${kes(a*FEE)}</span></div>`}

const forms={
async login(f){const em=f.get('email').trim().toLowerCase(),pw=f.get('pw');
if(fbAuth){try{await fbAuth.signInWithEmailAndPassword(em,pw)}catch(e){return toast('Wrong email or password')}
const u=S.users.find(x=>x.email===em);if(!u)return askRole({email:em,name:em.split('@')[0]});S.me=u.id;save();location.hash='#/dash';return app()}
const u=S.users.find(x=>x.email===em&&x.pw===pw);if(!u)return toast('Wrong email or password');S.me=u.id;save();location.hash='#/dash';app()},
async signup(f){const e=f.get('email').trim().toLowerCase(),r=f.get('role');if(S.users.some(x=>x.email===e))return toast('That email already has an account');
if(r==='tutor'&&!f.getAll('langs').length)return toast('Pick at least one language');
if(fbAuth){try{await fbAuth.createUserWithEmailAndPassword(e,f.get('pw'))}catch(x){return toast(x.code==='auth/email-already-in-use'?'That email already has an account':'Could not create account: '+x.code)}}
make({role:r,name:f.get('name').trim(),email:e,pw:fbAuth?'':f.get('pw'),country:f.get('country'),langs:f.getAll('langs'),rate:f.get('rate'),city:f.get('city')})},
role(f,el){const r=f.get('role');if(r==='tutor'&&!f.getAll('langs').length)return toast('Pick at least one language');make({role:r,name:el.dataset.n,email:el.dataset.e,country:f.get('country'),langs:f.getAll('langs'),rate:f.get('rate'),city:f.get('city')})},
book(f,el){const u=me();if(!u){closeM();authTab='login';location.hash='#/auth';return toast('Log in to book a lesson')}
if(u.role!=='learner')return toast('Tutors cannot book lessons. Use a learner account.');
const at=new Date(f.get('at')).getTime();if(!(at>Date.now()))return toast('Pick a time in the future');
if(!/^(\+?254|0)[17]\d{8}$/.test(f.get('ph').replace(/\s/g,'')))return toast('Enter a valid M-Pesa number');
const t=U(el.dataset.id),h=+f.get('h'),amt=t.rate*h;S.bk.push({id:uid(),t:t.id,l:u.id,lang:f.get('lang'),at,h,amt,net:Math.round(amt*(1-FEE)),st:'paid',rev:null,ts:Date.now()});
save();closeM();location.hash='#/dash';app();toast('Payment received. Waiting for '+t.name.split(' ')[0]+' to accept')},
payout(f){const u=me(),a=+f.get('amt'),ph=f.get('ph').replace(/\s/g,'');if(a<100||a>u.bal)return toast('Enter an amount up to '+kes(u.bal));
if(!/^(\+?254|0)[17]\d{8}$/.test(ph))return toast('Enter a valid M-Pesa number');u.bal-=a;S.po.push({id:uid(),u:u.id,amt:a,ph,st:'processing',ts:Date.now()});save();app();toast('Payout requested')},
profile(f){const u=me(),l=f.getAll('langs');if(!l.length)return toast('Pick at least one language');Object.assign(u,{langs:l,rate:+f.get('rate')||u.rate,city:f.get('city'),bio:f.get('bio')});save();app();toast('Profile saved')}};

const acts={
view:d=>view(d.id),close:closeM,
lang:d=>{F.lang=d.l;G=d.l||G;if(d.l){$('#gw').textContent=L[G][0];$('#gm').textContent=G+' for “'+L[G][1]+'”'}document.querySelectorAll('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===F.lang));drawGrid()},
tab:d=>{authTab=d.t;if(location.hash==='#/auth')app()},
out:()=>{S.me=null;save();fbAuth&&fbAuth.signOut();location.hash='#/';app()},
demo:d=>{S.me=S.users.find(x=>x.email===d.e).id;save();location.hash='#/dash';app()},google:()=>googleIn(),
confirm:d=>{S.bk.find(b=>b.id===d.id).st='confirmed';save();app();toast('Lesson accepted')},
done:d=>{const b=S.bk.find(x=>x.id===d.id);b.st='completed';b.cd=Date.now();const t=U(b.t);t.bal+=b.net;t.earned+=b.net;t.rn++;save();app();toast(kes(b.net)+' added to your balance')},
cancel:d=>{S.bk.find(b=>b.id===d.id).st='cancelled';save();app();toast('Lesson cancelled and refunded')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&a.tagName!=='SELECT'&&a.tagName!=='OPTION')acts[a.dataset.a]?.(a.dataset,a);if(e.target.id==='modal')closeM()});
document.addEventListener('change',e=>{const a=e.target.dataset?.a;
if(a==='calc')calc();
if(a==='role'){const f=e.target.form,t=e.target.value==='tutor';f.querySelector('.tf').style.display=t?'block':'none';f.querySelector('.lf').style.display=t?'none':'block'}
if(a==='rate'&&e.target.value){const b=S.bk.find(x=>x.id===e.target.dataset.id);b.rev=+e.target.value;const t=U(b.t);t.rating=(t.rating*t.rn+b.rev)/(t.rn+1);t.rn++;save();app();toast('Thanks for your rating')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;drawGrid()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;forms[f.dataset.f]?.(new FormData(f),f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
window.addEventListener('hashchange',()=>{app();scrollTo(0,0)});app();
if(fbAuth)fbAuth.onAuthStateChanged(g=>{if(g&&!me()){const u=S.users.find(x=>x.email===(g.email||'').toLowerCase());if(u){S.me=u.id;save();app()}}});
</script>
</body>
</html>
